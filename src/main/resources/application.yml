spring:
  application:
    name: miniprontuario-backend
  datasource:
    url: jdbc:h2:mem:miniprontuario_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama-3.1-8b-instant
      audio:
        transcription:
          options:
            model: whisper-large-v3

jwt:
  secret: ${JWT_SECRET:9a78e727589f2a975dfbf5e1582236968d904b68e9a2632b71d60db8311ebc4b}
  expiration: 1800000 # 30 minutes in ms (VA2 requirement)
